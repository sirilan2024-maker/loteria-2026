    const formatCurrency = (val) => `${Number(val || 0).toLocaleString('es-ES', { minimumFractionDigits: 2, maximumFractionDigits: 2 })} €`;
    const formatDateTime = (dateStr) => {
      if (!dateStr) return '';
      const d = new Date(dateStr);
      return isNaN(d.getTime()) ? dateStr : d.toLocaleString('es-ES', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
    };
    const formatDate = (dateStr) => {
      if (!dateStr) return '';
      const d = new Date(dateStr);
      return isNaN(d.getTime()) ? dateStr : d.toLocaleDateString('es-ES');
    };

    function LoginScreen() {
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [mode, setMode] = useState('login');
      const [busy, setBusy] = useState(false);
      const [message, setMessage] = useState('');

      const submit = async (e) => {
        e.preventDefault();
        setBusy(true); setMessage('');
        try {
          const result = mode === 'login'
            ? await supabaseClient.auth.signInWithPassword({ email, password })
            : await supabaseClient.auth.signUp({ email, password });
          if (result.error) throw result.error;
          if (mode === 'signup' && !result.data.session) {
            setMessage('Cuenta creada. Revisa tu correo para confirmar la cuenta y después inicia sesión.');
            setMode('login');
          }
        } catch (err) {
          setMessage(err.message || 'No se pudo completar la operación.');
        } finally { setBusy(false); }
      };

      return (
        <div className="min-h-screen bg-slate-950 text-white flex items-center justify-center p-4">
          <div className="w-full max-w-md bg-slate-900 border border-slate-800 rounded-3xl p-6 shadow-2xl">
            <div className="text-center mb-6">
              <div className="text-4xl mb-2">🎟️</div>
              <h1 className="text-2xl font-black">Control Lotería de Navidad</h1>
              <p className="text-slate-400 text-sm mt-2">Datos sincronizados entre ordenador y móvil</p>
            </div>
            <form onSubmit={submit} className="space-y-4">
              <input type="email" required value={email} onChange={e=>setEmail(e.target.value)}
                placeholder="Correo electrónico" className="w-full rounded-xl bg-slate-800 border border-slate-700 p-3 text-white outline-none" />
              <input type="password" required minLength="6" value={password} onChange={e=>setPassword(e.target.value)}
                placeholder="Contraseña" className="w-full rounded-xl bg-slate-800 border border-slate-700 p-3 text-white outline-none" />
              <button disabled={busy} className="w-full rounded-xl bg-amber-500 hover:bg-amber-400 text-slate-950 font-black p-3 disabled:opacity-50">
                {busy ? 'Procesando…' : mode === 'login' ? 'Entrar' : 'Crear cuenta'}
              </button>
            </form>
            {message && <div className="mt-4 rounded-xl bg-slate-800 p-3 text-sm text-amber-300">{message}</div>}
            <button onClick={()=>{setMode(mode==='login'?'signup':'login');setMessage('');}}
              className="w-full mt-4 text-sm text-slate-400 hover:text-white">
              {mode === 'login' ? 'Crear una cuenta nueva' : 'Ya tengo una cuenta'}
            </button>
          </div>

      );
    }

    function App() {
      const [data, setData] = useState(null);
      const [session, setSession] = useState(null);
      const [cloudReady, setCloudReady] = useState(false);
      const [syncing, setSyncing] = useState(false);
      const cloudLoadedRef = useRef(false);
      const saveTimerRef = useRef(null);

      useEffect(() => {
        let mounted = true;
        const loadForSession = async (currentSession) => {
          if (!currentSession) {
            if (mounted) { setSession(null); setData(null); setCloudReady(false); }
            return;
          }
          setSession(currentSession);
          setCloudReady(false);
          try {
            const { data: row, error } = await supabaseClient
              .from('app_state').select('data').eq('user_id', currentSession.user.id).maybeSingle();
            if (error) throw error;

            let initialData = row?.data;
            if (!initialData) {
              const local = localStorage.getItem('control_loteria_db_v15');
              try { initialData = local ? JSON.parse(local) : INITIAL_DEMO_DATA; } catch (_) { initialData = INITIAL_DEMO_DATA; }
              const { error: upsertError } = await supabaseClient.from('app_state').upsert({
                user_id: currentSession.user.id,
                data: initialData,
                updated_at: new Date().toISOString()
              }, { onConflict: 'user_id' });
              if (upsertError) throw upsertError;
            }
            if (mounted) {
              cloudLoadedRef.current = true;
              setData(initialData);
              setCloudReady(true);
            }
          } catch (err) {
            console.error('Error cargando datos de la nube:', err);
            if (mounted) {
              setData(null);
              setCloudReady(false);
              alert('No se pudieron cargar los datos de la nube. Comprueba la configuración de Supabase.');
            }
          }
        };

        supabaseClient.auth.getSession().then(({ data }) => loadForSession(data.session));
        const { data: listener } = supabaseClient.auth.onAuthStateChange((_event, currentSession) => loadForSession(currentSession));
        return () => { mounted = false; listener.subscription.unsubscribe(); };
      }, []);

      useEffect(() => {
        if (!cloudReady || !session || !data || !cloudLoadedRef.current) return;
        clearTimeout(saveTimerRef.current);
        saveTimerRef.current = setTimeout(async () => {
          setSyncing(true);
          localStorage.setItem('control_loteria_db_v15', JSON.stringify(data));
          const { error } = await supabaseClient.from('app_state').upsert({
            user_id: session.user.id,
            data,
            updated_at: new Date().toISOString()
          }, { onConflict: 'user_id' });
          if (error) console.error('Error sincronizando con la nube:', error);
          setSyncing(false);
        }, 600);
        return () => clearTimeout(saveTimerRef.current);
      }, [data, session, cloudReady]);

      if (!session) return <LoginScreen />;
      if (!cloudReady || !data) {
        return <div className="min-h-screen bg-slate-950 text-white flex items-center justify-center">
          <div className="text-center"><div className="text-4xl mb-3">☁️</div><p className="font-bold">Cargando datos…</p><p className="text-slate-500 text-sm mt-1">Conectando con la base de datos</p></div>
        </div>;
      }
      const [movTabFilter, setMovTabFilter] = useState('todos');
      const [isQuickRepartoOpen, setIsQuickRepartoOpen] = useState(false);
      const [preselectedPersonId, setPreselectedPersonId] = useState('');
      const [isAddLotteryOpen, setIsAddLotteryOpen] = useState(false);
      const [isAddClubLotteryOpen, setIsAddClubLotteryOpen] = useState(false);
      const [isPayLoteroOpen, setIsPayLoteroOpen] = useState(false);
      const [isReturnLoteroOpen, setIsReturnLoteroOpen] = useState(false);
      const [isAddPersonOpen, setIsAddPersonOpen] = useState(false);
      const [isImportPeopleOpen, setIsImportPeopleOpen] = useState(false);
      const [isAddPaymentOpen, setIsAddPaymentOpen] = useState(false);
      const [selectedPersonForPayment, setSelectedPersonForPayment] = useState(null);
      const [isReturnModalOpen, setIsReturnModalOpen] = useState(false);
      const [selectedReturnDist, setSelectedReturnDist] = useState(null);
      const [isCampaignsModalOpen, setIsCampaignsModalOpen] = useState(false);
      const [selectedPersonDetail, setSelectedPersonDetail] = useState(null);
      const [expandedPersonIds, setExpandedPersonIds] = useState({});
      const [toastMessage, setToastMessage] = useState(null);

      const showToast = (msg, type = 'success') => {
        setToastMessage({ text: msg, type });
        setTimeout(() => setToastMessage(null), 3500);
      };

      const toggleExpandPerson = (personId) => {
        setExpandedPersonIds(prev => ({ ...prev, [personId]: !prev[personId] }));
      };

      const activeCampaign = useMemo(() => {
        return data.campaigns.find(c => c.id === data.activeCampaignId) || data.campaigns[0] || { id: 'camp_default', name: 'Campaña General', defaultCostPrice: 20, defaultSurcharge: 3, status: 'active' };
      }, [data.campaigns, data.activeCampaignId]);

      const isCampaignClosed = activeCampaign.status === 'closed';
      const clubEntityName = data.settings.clubEntityName || '⭐ Lotería de la Peña / Asociación';
      const priceProfiles = data.settings.priceProfiles || [
        { id: 'prof_1', name: 'Estándar (+3€ beneficio)', costPrice: 20, surcharge: 3 },
        { id: 'prof_2', name: 'Reducido (+2€ beneficio)', costPrice: 20, surcharge: 2 }
      ];

      // --- FILTROS ESTRICTOS POR CAMPAÑA ACTIVA ---
      const currentLotteryEntries = useMemo(() => {
        return data.lotteryEntries.filter(e => e.campaignId === activeCampaign.id);
      }, [data.lotteryEntries, activeCampaign.id]);

      const currentDistributions = useMemo(() => {
        return data.distributions.filter(d => d.campaignId === activeCampaign.id && d.status !== 'cancelled' && d.decimos > 0);
      }, [data.distributions, activeCampaign.id]);

      const currentPayments = useMemo(() => {
        return (data.payments || []).filter(p => p.campaignId === activeCampaign.id);
      }, [data.payments, activeCampaign.id]);

      const currentLoteroPayments = useMemo(() => {
        return (data.loteroPayments || []).filter(p => p.campaignId === activeCampaign.id);
      }, [data.loteroPayments, activeCampaign.id]);

      const currentLoteroReturns = useMemo(() => {
        return (data.loteroReturns || []).filter(p => p.campaignId === activeCampaign.id);
      }, [data.loteroReturns, activeCampaign.id]);

      const currentMovements = useMemo(() => {
        return data.movements.filter(m => m.campaignId === activeCampaign.id);
      }, [data.movements, activeCampaign.id]);

      // Repartos agrupados por persona
      const groupedDistributionsByPerson = useMemo(() => {
        const personMap = {};

        data.people.forEach(p => {
          const dists = currentDistributions.filter(d => d.personId === p.id);
          if (dists.length === 0) return;

          const totalDecimos = dists.reduce((sum, d) => sum + d.decimos, 0);
          const totalReturned = dists.reduce((sum, d) => sum + (d.returnedDecimos || 0), 0);
          const totalAmount = dists.reduce((sum, d) => sum + d.totalAmount, 0);
          const totalCostAmount = dists.reduce((sum, d) => sum + (d.totalCostAmount || (d.decimos * (d.costPricePerDecimo || 20))), 0);
          const totalProfitAmount = dists.reduce((sum, d) => sum + (d.totalProfitAmount || (d.decimos * (d.surchargePerDecimo || 0))), 0);
          const totalPaid = dists.reduce((sum, d) => sum + d.paidAmount, 0);
          const totalPending = Math.max(0, totalAmount - totalPaid);

          const sortedDists = [...dists].sort((a, b) => new Date(b.date) - new Date(a.date));

          personMap[p.id] = {
            person: p,
            deliveriesCount: dists.length,
            totalDecimos,
            totalReturned,
            totalAmount,
            totalCostAmount,
            totalProfitAmount,
            totalPaid,
            totalPending,
            isFullyPaid: totalPending === 0,
            distributions: sortedDists
          };
        });

        return Object.values(personMap);
      }, [data.people, currentDistributions]);

      const inventoryByNumber = useMemo(() => {
        const map = {};

        currentLotteryEntries.forEach(entry => {
          const num = entry.number;
          if (!map[num]) {
            map[num] = {
              number: num,
              seriesReceived: 0,
              decimosReceived: 0,
              decimosDistributed: 0,
              costPricePerDecimo: entry.costPricePerDecimo || data.settings.defaultCostPrice || 20
            };
          }
          map[num].seriesReceived += Number(entry.series || 0);
          map[num].decimosReceived += Number(entry.decimos || 0);
        });

        currentDistributions.forEach(dist => {
          const num = dist.number;
          if (!map[num]) {
            map[num] = {
              number: num,
              seriesReceived: 0,
              decimosReceived: 0,
              decimosDistributed: 0,
              costPricePerDecimo: dist.costPricePerDecimo || data.settings.defaultCostPrice || 20
            };
          }
          map[num].decimosDistributed += Number(dist.decimos || 0);
        });

        currentLoteroReturns.forEach(ret => {
          const num = ret.number;
          if (map[num]) {
            map[num].decimosReceived -= Number(ret.decimos || 0);
          }
        });

        return Object.values(map).map(item => {
          const availableDecimos = Math.max(0, item.decimosReceived - item.decimosDistributed);
          const availableSeries = Math.floor(availableDecimos / 10);
          const totalCostValue = availableDecimos * item.costPricePerDecimo;
          return {
            ...item,
            availableDecimos,
            availableSeries,
            totalCostValue
          };
        });
      }, [currentLotteryEntries, currentDistributions, currentLoteroReturns, data.settings.defaultCostPrice]);

      const kpis = useMemo(() => {
        let totalDecimosRec = 0;
        let totalSeriesRec = 0;
        let totalDecimosRep = 0;
        let totalDecimosPeña = 0;
        let totalDecimosClientes = 0;

        let valorCosteRecibido = 0;
        let valorVentaRepartido = 0;
        let totalCosteLoteroRepartido = 0;
        let totalBeneficioPotencial = 0;

        currentLotteryEntries.forEach(entry => {
          totalDecimosRec += entry.decimos;
          totalSeriesRec += entry.series;
          valorCosteRecibido += entry.decimos * (entry.costPricePerDecimo || data.settings.defaultCostPrice || 20);
        });

        currentLoteroReturns.forEach(ret => {
          totalDecimosRec -= Number(ret.decimos || 0);
          valorCosteRecibido -= Number(ret.totalCost || 0);
        });

        currentDistributions.forEach(dist => {
          totalDecimosRep += dist.decimos;
          if (dist.personId === 'p_club') {
            totalDecimosPeña += dist.decimos;
          } else {
            totalDecimosClientes += dist.decimos;
          }
          valorVentaRepartido += dist.totalAmount;
          totalCosteLoteroRepartido += (dist.totalCostAmount || (dist.decimos * (dist.costPricePerDecimo || 20)));
          totalBeneficioPotencial += (dist.totalProfitAmount || (dist.decimos * (dist.surchargePerDecimo || 0)));
        });

        const totalDecimosDisp = Math.max(0, totalDecimosRec - totalDecimosRep);
        const totalSeriesDisp = Math.floor(totalDecimosDisp / 10);
        const totalSeriesRep = (totalDecimosRep / 10).toFixed(1);
        const valorCosteDisponible = Math.max(0, valorCosteRecibido - totalCosteLoteroRepartido);

        let dineroTotalCobrado = 0;
        let dineroPendienteTotal = 0;

        currentDistributions.forEach(dist => {
          dineroTotalCobrado += Number(dist.paidAmount || 0);
          const pending = Number(dist.totalAmount || 0) - Number(dist.paidAmount || 0);
          if (pending > 0) dineroPendienteTotal += pending;
        });

        let dineroPagadoAlLotero = 0;
        currentLoteroPayments.forEach(p => {
          dineroPagadoAlLotero += Number(p.amount || 0);
        });

        const deudaTotalInicialLotero = valorCosteRecibido;
        const deudaPendienteRealLotero = Math.max(0, deudaTotalInicialLotero - dineroPagadoAlLotero);

        const ratioCobro = valorVentaRepartido > 0 ? (dineroTotalCobrado / valorVentaRepartido) : 0;
        const beneficioCobradoReal = totalBeneficioPotencial * ratioCobro;
        const beneficioPendienteCobro = Math.max(0, totalBeneficioPotencial - beneficioCobradoReal);

        return {
          totalDecimosRec,
          totalSeriesRec,
          totalDecimosRep,
          totalDecimosPeña,
          totalDecimosClientes,
          totalSeriesRep,
          totalDecimosDisp,
          totalSeriesDisp,
          valorCosteRecibido,
          valorVentaRepartido,
          valorCosteDisponible,
          dineroTotalCobrado,

              remainingPayment -= applyAmount;
              return {

                paidAmount: newPaid,
                status: newPaid >= d.totalAmount ? 'paid' : 'partial'

          return d;

    // Modal: Devolver al Lotero
    function ReturnLoteroModal({ inventory, onClose, onSubmit }) {
      const [number, setNumber] = useState(inventory.length > 0 ? inventory[0].number : '');
      const [quantity, setQuantity] = useState('1');
      const [notes, setNotes] = useState('');

      const selectedInv = inventory.find(i => i.number === number);
      const maxStock = selectedInv ? selectedInv.availableDecimos : 0;
      const costPrice = selectedInv ? selectedInv.costPricePerDecimo : 20;
      const numQty = Number(quantity) || 0;
      const totalCostReduction = numQty * costPrice;

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!number) { alert('Selecciona un número.'); return; }
        if (numQty <= 0 || numQty > maxStock) {
          alert(`Introduce una cantidad válida entre 1 y ${maxStock} décimos.`);
          return;
        }
        onSubmit({ number, quantity: numQty, notes });
      };

      return (
        <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-3.5">
          <div className="bg-slate-900 border border-slate-800 w-full max-w-md rounded-2xl p-5 space-y-3.5 text-xs sm:text-sm">
            <div className="flex justify-between items-center border-b border-slate-800 pb-2.5">
              <div className="flex items-center gap-2">
                <span className="p-2 rounded-xl bg-amber-500/10 text-amber-400"><i className="fas fa-rotate-left"></i></span>
                <h3 className="font-black text-white text-base">Devolver Lotería al Lotero</h3>
              </div>
              <button onClick={onClose} className="text-slate-400 p-1">✕</button>
            </div>
            <p className="text-slate-400 text-xs">
              Devuelve décimos sobrantes sin repartir al proveedor. Se restarán de tu stock disponible y se descontarán de tu deuda con el lotero.
            </p>
            <form onSubmit={handleSubmit} className="space-y-3">
              <div>
                <label className="text-slate-300 block mb-1 font-bold">Número de Lotería</label>
                <select value={number} onChange={(e) => setNumber(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-white font-mono font-black text-amber-400" required>
                  {inventory.map(inv => (
                    <option key={inv.number} value={inv.number}>
                      Nº {inv.number} — Stock disp: {inv.availableDecimos} déc.
                    </option>
                  ))}
                </select>
              </div>
              <div>
                <label className="text-slate-300 block mb-1 font-bold">¿Cuántos décimos devuelves? (Máx: {maxStock})</label>
                <input
                  type="number"
                  min="1"
                  max={maxStock}
                  value={quantity}
                  onChange={(e) => setQuantity(e.target.value)}
                  className="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-white font-black text-xl text-center"
                  required
                />
              </div>
              <div>
                <label className="text-slate-300 block mb-1 font-semibold">Motivo / Notas</label>
                <input
                  type="text"
                  placeholder="Ej: Devolución por sobrante"
                  value={notes}
                  onChange={(e) => setNotes(e.target.value)}
                  className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-white"
                />
              </div>
              <div className="p-3 bg-slate-950 rounded-xl flex justify-between items-center text-xs">
                <span className="text-slate-400">Descontar de deuda con el lotero:</span>
                <strong className="text-amber-400 font-black text-sm">-{formatCurrency(totalCostReduction)}</strong>
              </div>
              <button type="submit" className="w-full py-3.5 rounded-xl bg-amber-500 text-slate-950 font-black text-sm shadow-xl">
                Confirmar Devolución ({numQty} décimos)
              </button>
            </form>
          </div>
        </div>
      );
    }

                Confirmar Pago al Lotero ({formatCurrency(Number(amount) || 0)})

    // Modal: Reparto (CON SELECTOR RÁPIDO DE PERFILES DE PRECIOS)
    function QuickRepartoModal({ people, inventory, initialPersonId, defaultCostPrice, defaultSurcharge, priceProfiles, onClose, onSubmit, onAddPerson }) {
      const [personId, setPersonId] = useState(initialPersonId || '');
      const [number, setNumber] = useState(inventory.length > 0 ? inventory[0].number : '');
      const [unitType, setUnitType] = useState('decimos');
      const [quantity, setQuantity] = useState('1');
      const [costPricePerDecimo, setCostPricePerDecimo] = useState(String(defaultCostPrice));
      const [surchargePerDecimo, setSurchargePerDecimo] = useState(String(defaultSurcharge));
      const [seriesIdent, setSeriesIdent] = useState('');
      const [paymentState, setPaymentState] = useState('paid');
      const [partialAmount, setPartialAmount] = useState('20');
      const [paymentMethod, setPaymentMethod] = useState('Efectivo');

      useEffect(() => {
        if (initialPersonId) setPersonId(initialPersonId);
      }, [initialPersonId]);

      const handleProfileSelect = (profId) => {
        const prof = (priceProfiles || []).find(p => p.id === profId);
        if (prof) {
          setCostPricePerDecimo(String(prof.costPrice));
          setSurchargePerDecimo(String(prof.surcharge));
        }
      };

      const numericQty = Number(quantity) || 0;
      const numericCost = Number(costPricePerDecimo) || 0;
      const numericSurcharge = Number(surchargePerDecimo) || 0;

      const calculatedDecimos = unitType === 'series' ? numericQty * 10 : numericQty;
      const sellingPrice = numericCost + numericSurcharge;
      const totalAmount = calculatedDecimos * sellingPrice;

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!personId) { alert('Selecciona una persona.'); return; }
        if (!number) { alert('Selecciona un número.'); return; }
        if (calculatedDecimos <= 0) { alert('Introduce una cantidad válida.'); return; }

        onSubmit({
          personId,
          number,
          series: unitType === 'series' ? numericQty : 0,
          decimos: unitType === 'decimos' ? numericQty : 0,
          seriesIdent,
          costPricePerDecimo: numericCost || defaultCostPrice,
          surchargePerDecimo: numericSurcharge,
          paymentState,
          partialAmount: paymentState === 'partial' ? (Number(partialAmount) || 0) : 0,
          paymentMethod
        });
      };

      return (
        <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-end sm:items-center justify-center p-0 sm:p-4">
          <div className="bg-slate-900 border border-slate-800 w-full max-w-lg rounded-t-3xl sm:rounded-2xl p-5 space-y-3.5 max-h-[90vh] overflow-y-auto custom-scrollbar">

            </div>

                  <button type="button" onClick={onAddPerson} className="text-amber-400 font-bold text-xs">+ Nueva</button>
                </div>
                <select value={personId} onChange={(e) => setPersonId(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-white font-medium" required>
                  <option value="">-- Seleccionar Persona --</option>
                  {people.map(p => <option key={p.id} value={p.id}>{p.name}</option>)}
                </select>
              </div>

              <div>
                <label className="font-bold text-slate-300 block mb-1">Número de Lotería</label>
                <select value={number} onChange={(e) => setNumber(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-white font-mono font-black text-amber-400" required>

                    <option key={inv.number} value={inv.number}>
                      Nº {inv.number} — Disp: {inv.availableDecimos} déc.
                    </option>
                  ))}
                </select>
              </div>

              {/* SELECTOR RÁPIDO DE PERFIL DE PRECIOS */}
              <div>
                <label className="text-amber-300 block mb-1 font-bold text-xs">⚡ Aplicar Margen / Perfil Predefinido</label>
                <select onChange={(e) => handleProfileSelect(e.target.value)} className="w-full bg-slate-950 border border-amber-500/30 rounded-xl p-2.5 text-amber-300 font-bold text-xs">
                  <option value="">-- Seleccionar margen de beneficio --</option>
                  {(priceProfiles || []).map(prof => (

    // Modal: Importar Personas
    function ImportPeopleModal({ onClose, onImport }) {
      const [rawText, setRawText] = useState('');

      const handleFileUpload = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => setRawText(event.target.result);
        reader.readAsText(file);
      };

      const parsePeople = () => {
        if (!rawText.trim()) return [];
        const lines = rawText.split('\n');
        const list = [];
        lines.forEach((line, index) => {
          const clean = line.trim();
          if (!clean) return;
          let parts = clean.split(/[;,	]/);
          if (parts.length === 1) parts = [clean, '', ''];
          const name = parts[0]?.trim();
          const phone = parts[1]?.trim() || '';
          const notes = parts[2]?.trim() || '';
          if (name && name.toLowerCase() !== 'nombre' && name.toLowerCase() !== 'name') {
            list.push({ id: 'p_imp_' + Date.now() + '_' + index, name, phone, email: '', notes });
          }
        });
        return list;
      };

      const parsedList = parsePeople();

      return (
        <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-3.5">
          <div className="bg-slate-900 border border-slate-800 w-full max-w-lg rounded-2xl p-5 space-y-3.5 max-h-[90vh] overflow-y-auto custom-scrollbar text-xs sm:text-sm">

            </div>
            <div>
              <label className="text-slate-300 block mb-1 font-semibold">1. Subir archivo CSV</label>
              <input type="file" accept=".csv, .txt" onChange={handleFileUpload} className="w-full text-xs text-slate-400 file:mr-2 file:py-2 file:px-3.5 file:rounded-xl file:border-0 file:bg-blue-600 file:text-white" />
            </div>
            <div>
              <label className="text-slate-300 block mb-1 font-semibold">2. O pegar listado (un nombre por línea)</label>
              <textarea rows="4" placeholder="Juan Pérez, 611223344" value={rawText} onChange={(e) => setRawText(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-white font-mono text-xs" />
            </div>
            <button type="button" disabled={parsedList.length === 0} onClick={() => onImport(parsedList)} className="w-full py-3 rounded-xl bg-blue-600 text-white font-black text-xs disabled:opacity-50">
              Importar {parsedList.length} Personas
            </button>
          </div>
        </div>
      );
    }
